<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal del Inframundo - Principal</title>
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <!-- BARRA SUPERIOR: las 6 pestañas del dibujo -->
    <header class="topbar">
        <nav class="tabs">
            <!-- data-seccion debe coincidir con el id de la sección de abajo -->
            <button class="tab active" data-seccion="inicio">Inicio</button>
            <button class="tab" data-seccion="seccion2">Sección 2</button>
            <button class="tab" data-seccion="seccion3">Sección 3</button>
            <button class="tab" data-seccion="seccion4">Sección 4</button>
            <button class="tab" data-seccion="seccion5">Sección 5</button>
            <button class="tab" data-seccion="ajustes">Ajustes</button>
        </nav>
    </header>

    <!-- ZONA DE CONTENIDO: solo se ve la sección activa -->
    <main class="contenido">

        <section id="inicio" class="seccion active">
            <h1>BIENVENIDO, <span id="nombreUsuario"></span>💀</h1>
            <p>Has cruzado el portal. Aquí irá el contenido principal.</p>
        </section>

        <section id="seccion2" class="seccion">
            <h2>Sección 2</h2>
            <p>Contenido de la sección 2.</p>
        </section>

        <section id="seccion3" class="seccion">
            <h2>Sección 3</h2>
            <p>Contenido de la sección 3.</p>
        </section>

        <section id="seccion4" class="seccion">
            <h2>Sección 4</h2>
            <p>Contenido de la sección 4.</p>
        </section>

        <section id="seccion5" class="seccion">
            <h2>Sección 5</h2>
            <p>Contenido de la sección 5.</p>
        </section>

        <section id="ajustes" class="seccion">
            <h2>Ajustes</h2>
            <p>Aquí irán las opciones de la cuenta.</p>
            <button class="btn-salir" id="salir">Cerrar sesión</button>
        </section>

    </main>

    <script src="dashboard.js"></script>
</body>

</html>
